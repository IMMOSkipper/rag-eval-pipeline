services:
  # 1. Redis 服务
  redis:
    image: redis:7-alpine
    container_name: rag_redis
    ports:
      - "6379:6379"
    restart: always

  # 2. FastAPI 后端服务
  api:
    build: .
    container_name: rag_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HF_ENDPOINT=https://hf-mirror.com
      - REDIS_URL=redis://redis:6379/0 # 覆盖代码里的 localhost
    depends_on:
      - redis
    volumes:
      - .:/app
      - ./chroma_db:/app/chroma_db
      - ./data:/app/data
      # 【新增】把本地模型缓存直接挂载到容器内，秒加载，无需下载
      - ~/.cache/huggingface:/root/.cache/huggingface
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  # 3. Celery 异步 Worker 服务
  worker:
    build: .
    container_name: rag_worker
    env_file:
      - .env
    environment:
      - HF_ENDPOINT=https://hf-mirror.com
      - REDIS_URL=redis://redis:6379/0 # 覆盖代码里的 localhost
    depends_on:
      - redis
    volumes:
      - .:/app
      - ./chroma_db:/app/chroma_db
      - ./data:/app/data
      # 【新增】把本地模型缓存直接挂载到容器内，秒加载，无需下载
      - ~/.cache/huggingface:/root/.cache/huggingface
    # 启动 Worker
    command: celery -A app.celery_app worker --loglevel=info